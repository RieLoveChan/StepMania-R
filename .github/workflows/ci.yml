on:
  push:
  pull_request:
    paths-ignore:
      - '**.md'

name: Continuous integration

jobs:
  ubuntu-build:
    name: Ubuntu (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y
          libasound2-dev
          libgl-dev
          libglu1-mesa-dev
          libgtk-3-dev
          libjack-dev
          libmad0-dev
          libpulse-dev
          libudev-dev
          libusb-dev
          libxinerama-dev
          libx11-dev
          libxrandr-dev
          libxtst-dev
          nasm
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release

  macos-build-arm64:
    name: macOS (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Install dependencies
        run: brew install
          nasm
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build
        run: cmake --build build --config Release

  macos-build-x86_64:
    name: macOS (x86_64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Install dependencies
        run: brew install
          nasm
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
      - name: Build
        run: cmake --build build --config Release

  windows-build:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Configure
        # WITH_WERROR: Windows/MSVC is verified warning-clean; keep it that
        # way. macOS/Linux stay non-fatal until their warning state is
        # audited. See DocsAgents/adr/0001-toolchain-target.md section 7.
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_WERROR=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Headless smoke test
        # --SelfTest runs full engine init then exits 0. Non-fatal for now
        # (renderer/loading-window behaviour on a headless runner is
        # unproven); flip to fatal once it's green a few times.
        continue-on-error: true
        timeout-minutes: 5
        run: ./Program/StepMania-R.exe --SelfTest --VideoRenderers=null --SoundDrivers=null

  # WITH_TESTS builds src/ as the sm_engine OBJECT library and adds the
  # sm_tests target (Catch2). Kept as separate jobs from the plain builds
  # so a red test never masks the ship-build / smoke signal while the
  # suite is young. See DocsAgents/adr/0006-test-harness.md.
  windows-tests:
    name: Windows unit tests (sm_tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Configure
        run: cmake -B build-tests -DCMAKE_BUILD_TYPE=Debug -DWITH_TESTS=ON -DWITH_WERROR=ON
      - name: Build tests
        run: cmake --build build-tests --config Debug --target sm_tests
      - name: Run tests
        run: ctest --test-dir build-tests -C Debug --output-on-failure

  ubuntu-tests:
    name: Ubuntu unit tests (sm_tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y
          libasound2-dev
          libgl-dev
          libglu1-mesa-dev
          libgtk-3-dev
          libjack-dev
          libmad0-dev
          libpulse-dev
          libudev-dev
          libusb-dev
          libxinerama-dev
          libx11-dev
          libxrandr-dev
          libxtst-dev
          nasm
      - name: Configure
        run: cmake -B build-tests -DCMAKE_BUILD_TYPE=Debug -DWITH_TESTS=ON
      - name: Build tests
        run: cmake --build build-tests --config Debug --target sm_tests
      - name: Run tests
        run: ctest --test-dir build-tests -C Debug --output-on-failure

  macos-tests:
    name: macOS unit tests (sm_tests, arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Install dependencies
        run: brew install
          nasm
      - name: Configure
        run: cmake -B build-tests -DCMAKE_BUILD_TYPE=Debug -DWITH_TESTS=ON -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build tests
        run: cmake --build build-tests --config Debug --target sm_tests
      - name: Run tests
        run: ctest --test-dir build-tests -C Debug --output-on-failure

  validate-xml-docs:
    name: Validate Lua.xml, LuaDocumentation.xml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y
          libxml2-utils
      - name: Validate Lua.xml
        run: xmllint --noout Docs/Luadoc/Lua.xml
      - name: Validate LuaDocumentation.xml
        run: xmllint --noout Docs/Luadoc/LuaDocumentation.xml