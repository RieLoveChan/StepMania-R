; Minimal scripts-free theme for EngineTestEnv (ADR 0006 / backlog item 17).
;
; sm_tests links the whole engine. Many engine constructors (Song,
; SongManager, ...) read ThemeMetric<T> values via GetValue(), which
; ASSERT_M( m_Value.IsSet() ) -- fatal, and on Unix sm_crash() _exit(1)s
; the whole test binary. So EngineTestEnv must load *a* theme.
;
; A real theme (default / _fallback) can't load headlessly: its metric
; values include Lua expressions that call GAMESTATE:GetCurrentGame() etc.
; on a not-yet-Reset() engine. This theme sets FallbackTheme= (no
; inheritance) and has no Scripts/, so SwitchThemeAndLanguage runs almost
; nothing. Metrics it doesn't define resolve "missing -> Dialog::ignore
; -> nil default", which is enough for the parse-regression tests.
;
; Only add a key here when a test actually needs a concrete value.

[Global]
FallbackTheme=

[Common]
ScreenWidth=640
ScreenHeight=480
ScreenNativeAspect=1.33333
DefaultNoteSkinName=default
ImageCache=0
PercentScoreDecimalPlaces=2

[SongManager]
NumSongGroupColors=1
NumCourseGroupColors=1
NumProfileSongGroupColors=1
